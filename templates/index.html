<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediCare Assist — Prototype</title>
<style>
:root{
  --bg:#F5F6F4; --panel:#FFFFFF; --ink:#16241F; --muted:#5B6B63;
  --line:#DDE4DE; --accent:#0F6B5C; --accent-ink:#FFFFFF;
  --badge:#B98900; --badge-bg:#FBF2DC; --warn-bg:#FDF3E8; --warn-line:#E7C89A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  background:var(--panel); position:sticky; top:0; z-index:5;}
.crest{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
header h1{font-size:15px;margin:0;line-height:1.3}
header p{margin:0;font-size:12px;color:var(--muted)}
.banner{max-width:720px;margin:12px auto 0;padding:10px 14px;background:var(--warn-bg);
  border:1px solid var(--warn-line);border-radius:8px;font-size:12.5px;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;
  border-radius:20px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
#log{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
.cite{display:inline-block;margin-top:6px;font-size:11px;background:var(--badge-bg);color:var(--badge);
  padding:2px 7px;border-radius:5px;margin-right:5px}
.card{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:13.5px;max-width:88%}
.card h3{margin:0 0 8px;font-size:13px}
.card label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.card input,.card select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font-size:13px}
.card button{margin-top:10px;background:var(--accent);color:var(--accent-ink);border:none;
  padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer}
.result{margin-top:8px;padding:9px 11px;border-radius:8px;font-size:13px}
.eligible{background:#E4F3EC;color:#0F6B5C}
.not-eligible{background:#FBE9E5;color:#B23A2E}
.typing{display:inline-flex;gap:4px;padding:2px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);
  animation:blink 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.25;transform:scale(0.85)}40%{opacity:1;transform:scale(1)}}
form.inputrow{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:8px 0 4px}
form.inputrow input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--ink);font-size:14px}
form.inputrow button{background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;
  padding:0 16px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="crest">MA</div>
  <div>
    <h1>MediCare Assist</h1>
    <p>Prototype chatbot &middot; healthcare subsidies &amp; MediSave claims</p>
  </div>
</header>
<div class="banner">This is a demo prototype for a security assessment. All policy text and eligibility results are mock/fake data, served by a local Flask backend. No real data, no write operations.</div>
<main>
  <div class="chips">
    <button class="chip" onclick="ask('What is MediSave?')">What is MediSave?</button>
    <button class="chip" onclick="ask('Am I eligible for a subsidy?')">Check my eligibility</button>
    <button class="chip" onclick="ask('How do I claim outpatient subsidies?')">How do I claim?</button>
  </div>
  <div id="log"></div>
  <form class="inputrow" onsubmit="return handleSubmit(event)">
    <input id="box" placeholder="Ask about subsidies or MediSave claims…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</main>
<script>
const log = document.getElementById('log');

function addMsg(text, who){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  log.appendChild(el);
  el.scrollIntoView({block:'end'});
  return el;
}

function handleSubmit(e){
  e.preventDefault();
  const box = document.getElementById('box');
  const val = box.value.trim();
  if(!val) return false;
  box.value = '';
  ask(val);
  return false;
}

async function ask(text){
  addMsg(text, 'user');
  const thinking = addTyping();
  let data;
  try{
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    data = await res.json();
  } finally {
    thinking.remove();
  }

  if(data.type === 'eligibility_form'){
    showEligibilityForm();
    return;
  }

  if(data.type === 'error'){
    addMsg('⚠ ' + (data.detail || 'The assistant backend did not respond.'), 'bot');
    return;
  }

  const bot = document.createElement('div');
  bot.className = 'msg bot';
  bot.textContent = data.reply;
  if(data.citations && data.citations.length){
    const cites = document.createElement('div');
    data.citations.forEach(c=>{
      const s = document.createElement('span');
      s.className = 'cite';
      s.textContent = '📄 ' + c.id;
      s.title = c.title;
      cites.appendChild(s);
    });
    bot.appendChild(cites);
  }
  log.appendChild(bot);
  bot.scrollIntoView({block:'end'});
}

function addTyping(){
  const el = document.createElement('div');
  el.className = 'msg bot typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  log.appendChild(el);
  el.scrollIntoView({block:'end'});
  return el;
}

function showEligibilityForm(){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>Check subsidy eligibility (mock, read-only)</h3>
    <label>Household income per person (SGD/month)</label>
    <input type="number" id="inc" placeholder="e.g. 1800">
    <label>Citizenship status</label>
    <select id="cit">
      <option value="citizen">Singapore Citizen</option>
      <option value="pr">Permanent Resident</option>
      <option value="other">Other</option>
    </select>
    <button type="button" onclick="runEligibility(this)">Check eligibility</button>
    <div class="result" id="res" style="display:none"></div>
  `;
  log.appendChild(card);
  card.scrollIntoView({block:'end'});
}

async function runEligibility(btn){
  const card = btn.closest('.card');
  const income = card.querySelector('#inc').value || '0';
  const citizenship = card.querySelector('#cit').value;
  btn.disabled = true; btn.textContent = 'Checking…';

  const res = await fetch('/api/eligibility', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({income, citizenship})
  });
  const result = await res.json();

  btn.disabled = false; btn.textContent = 'Check eligibility';
  const resEl = card.querySelector('#res');
  resEl.style.display = 'block';
  resEl.className = 'result ' + (result.eligible ? 'eligible' : 'not-eligible');
  resEl.textContent = (result.eligible ? '✓ Likely eligible — ' : '✗ Likely not eligible — ') + result.tier + '. ' + result.note;
  card.scrollIntoView({block:'end'});
}

addMsg("Hi, I'm MediCare Assist (prototype). Ask me about MediSave or healthcare subsidies, or try one of the quick options above.", 'bot');
</script>
</body>
</html>
